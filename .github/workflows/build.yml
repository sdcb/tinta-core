name: build

on:
  push:
    paths:
      - .github/workflows/build.yml
      - CMakeLists.txt
      - cmake/**
      - examples/**
      - include/**
      - src/**
      - tests/**
      - vendor/md4c/src/**
  pull_request:
    paths:
      - .github/workflows/build.yml
      - CMakeLists.txt
      - cmake/**
      - examples/**
      - include/**
      - src/**
      - tests/**
      - vendor/md4c/src/**

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [full, trimmed]
        shared: [OFF, ON]
        architecture:
          - name: x64
            platform: x64
            run_tests: true
          - name: x86
            platform: Win32
            run_tests: true
          - name: arm64
            platform: ARM64
            run_tests: false
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        shell: pwsh
        run: |
          $flags = @()
          if ('${{ matrix.configuration }}' -eq 'trimmed') {
            $flags += '-DTINTA_ENABLE_UIA=OFF'
            $flags += '-DTINTA_ENABLE_MERMAID=OFF'
            $flags += '-DTINTA_ENABLE_SYNTAX=OFF'
            $flags += '-DTINTA_ENABLE_REMOTE_IMAGES=OFF'
            $flags += '-DTINTA_ENABLE_LOCAL_IMAGES=OFF'
            $flags += '-DTINTA_ENABLE_SVG=OFF'
          }
          cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.architecture.platform }} `
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} `
            -DBUILD_TESTING=ON -DTINTA_BUILD_EXAMPLES=ON @flags
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        if: matrix.architecture.run_tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cmake --install build --config Release --prefix package
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: tinta-core-${{ matrix.configuration }}-${{ matrix.shared == 'ON' && 'shared' || 'static' }}-windows-${{ matrix.architecture.name }}
          path: package
          if-no-files-found: error

  windows-x64-demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure static CRT demo
        run: >-
          cmake -S . -B demo-build -G "Visual Studio 18 2026" -A x64
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_TESTING=OFF
          -DTINTA_BUILD_EXAMPLES=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build demo
        run: cmake --build demo-build --config Release --target tinta_demo --parallel
      - name: Upload demo
        uses: actions/upload-artifact@v7
        with:
          name: tinta-demo-windows-x64-static-msvcrt
          path: demo-build/Release/tinta_demo.exe
          if-no-files-found: error

  c-package:
    runs-on: windows-latest
    strategy:
      matrix:
        shared: [OFF, ON]
    steps:
      - uses: actions/checkout@v7
      - name: Build and install C library
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_TESTING=OFF -DTINTA_BUILD_EXAMPLES=OFF
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
      - run: cmake --build build --config Release --parallel
      - run: cmake --install build --config Release
      - name: Build C package consumer
        run: >-
          cmake -S tests/package_consumer -B consumer
          -G "Visual Studio 18 2026" -A x64
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
      - run: cmake --build consumer --config Release --parallel
